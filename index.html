<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resultify - Admin Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="./css/custom.css">
  <script type="module" src="./js/auth.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col justify-center px-4 py-8">
  <div class="max-w-md w-full mx-auto space-y-6">
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-14 h-14 rounded-2xl bg-gradient-to-tr from-teal-500 to-cyan-500 items-center justify-center shadow-lg shadow-teal-500/20">
        <span class="material-symbols-outlined text-white text-3xl">school</span>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Resultify Admin</h1>
      <p class="text-xs text-slate-400">Owner & Partner Management Portal</p>
    </div>

    <!-- Login Card -->
    <div class="glass-card rounded-3xl p-6 border border-slate-800 space-y-5">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Admin Email</label>
          <input type="email" id="email" required placeholder="admin@resultify.com" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-teal-400">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-100 text-sm focus:outline-none focus:border-teal-400">
        </div>

        <div id="errorMessage" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-xs text-red-400"></div>

        <button type="submit" id="loginBtn" class="w-full py-3.5 bg-gradient-to-r from-teal-500 to-cyan-500 text-white rounded-xl font-semibold text-sm shadow-lg shadow-teal-500/20 hover:opacity-95 transition-all">
          <span id="loginBtnText">Sign In as Admin</span>
        </button>
      </form>

      <!-- Dynamic Google Auth Section (Owner Controlled) -->
      <div id="googleAuthSection" class="space-y-3 pt-2">
        <div class="flex items-center gap-3">
          <div class="flex-1 h-px bg-slate-800"></div>
          <span class="text-[11px] text-slate-500 uppercase tracking-wider font-semibold">Or</span>
          <div class="flex-1 h-px bg-slate-800"></div>
        </div>
        <button id="googleSignInBtn" class="w-full py-3 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-200 rounded-xl font-medium text-sm flex items-center justify-center gap-3 transition-colors">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.9 6.4C.7 8.8 0 11.3 0 14s.7 5.2 1.9 7.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.2 7.5 23 12 23z"/></svg>
          Sign in with Google
        </button>
      </div>
      <p id="googleDisabledNotice" class="hidden text-center text-xs text-amber-400/80 pt-2">Google Sign-in disabled by Owner.</p>
    </div>
  </div>
</body>
</html>
