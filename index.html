<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resultify - Admin Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="./css/custom.css">
  <script type="module" src="./js/auth.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-center px-4 py-8 select-none" style="background-color: var(--bg-void); color: var(--text-primary);">
  <div class="max-w-sm w-full mx-auto space-y-6">
    <!-- Brand Header -->
    <div class="text-center space-y-2">
      <div class="inline-flex w-14 h-14 rounded-2xl items-center justify-center shadow-md" style="background-color: rgba(4, 120, 87, 0.15); border: 1px solid rgba(4, 120, 87, 0.35); color: var(--accent-mint);">
        <span class="material-symbols-outlined text-3xl">school</span>
      </div>
      <h1 class="text-2xl font-bold tracking-tight" style="color: var(--text-primary);">Resultify Admin</h1>
      <p class="text-xs" style="color: var(--text-muted);">Command Center & Operations Portal</p>
    </div>

    <!-- Login Surface Card -->
    <div class="surface-card p-6 space-y-4">
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color: var(--text-muted);">Admin Email</label>
          <input type="email" id="email" required placeholder="admin@resultify.com" class="w-full px-4 py-3 rounded-xl text-xs" style="color: var(--text-primary);">
        </div>
        <div>
          <label class="block text-xs font-semibold mb-1.5" style="color: var(--text-muted);">Password</label>
          <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl text-xs" style="color: var(--text-primary);">
        </div>

        <div id="errorMessage" class="hidden p-3 rounded-xl text-xs" style="background-color: rgba(190, 18, 60, 0.12); border: 1px solid rgba(190, 18, 60, 0.3); color: var(--accent-rose);"></div>

        <button type="submit" id="loginBtn" class="w-full py-3.5 rounded-xl font-bold text-xs shadow-md transition-all" style="background-color: var(--accent-mint); color: var(--bg-void);">
          <span id="loginBtnText">Sign In to Dashboard</span>
        </button>
      </form>

      <!-- Dynamic Google Auth Toggle Section -->
      <div id="googleAuthSection" class="space-y-3 pt-2">
        <div class="flex items-center gap-3">
          <div class="flex-1 h-px" style="background-color: var(--border-subtle);"></div>
          <span class="text-[10px] uppercase tracking-wider font-semibold" style="color: var(--text-subtle);">Or</span>
          <div class="flex-1 h-px" style="background-color: var(--border-subtle);"></div>
        </div>
        <button id="googleSignInBtn" class="w-full py-3 rounded-xl font-semibold text-xs flex items-center justify-center gap-2.5 transition-colors" style="background-color: var(--bg-input); border: 1px solid var(--border-subtle); color: var(--text-primary);">
          <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.4l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/><path fill="#FBBC05" d="M5.6 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.9 6.4C.7 8.8 0 11.3 0 14s.7 5.2 1.9 7.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 16.4C3.7 20.2 7.5 23 12 23z"/></svg>
          Sign in with Google
        </button>
      </div>
      <p id="googleDisabledNotice" class="hidden text-center text-xs pt-1 font-medium" style="color: var(--accent-amber);">Google Sign-in disabled by Owner.</p>
    </div>
  </div>
</body>
</html>
