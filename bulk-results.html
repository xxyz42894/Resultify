<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Sabse pehle security script load honi chahiye -->
  <script src="./js/security-guard.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resultify - Bulk Results Publish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="./css/custom.css">
  <script type="module" src="./js/auth-guard.js"></script>
</head>
<body class="min-h-screen pb-20 select-none" style="background-color: var(--bg-void); color: var(--text-primary);">
  <!-- Top Bar -->
  <header class="sticky top-0 z-30 border-b px-4 py-3 flex items-center justify-between backdrop-blur-xl" style="background-color: var(--bg-void); border-color: var(--border-subtle);">
    <div class="flex items-center gap-2.5">
      <a href="dashboard.html" class="w-8 h-8 rounded-xl flex items-center justify-center surface-card border" style="border-color: var(--border-subtle); color: var(--text-muted);">
        <span class="material-symbols-outlined text-18">arrow_back</span>
      </a>
      <div>
        <h1 class="text-sm font-bold" style="color: var(--text-primary);">Bulk Results Engine</h1>
        <p class="text-[10px]" style="color: var(--text-muted);">Queue multiple exams & 1-tap publish</p>
      </div>
    </div>
    <a href="results.html" class="px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 border surface-card" style="border-color: var(--border-subtle); color: var(--accent-mint);">
      <span class="material-symbols-outlined text-16">format_list_bulleted</span>
      <span>View Live</span>
    </a>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    <!-- Result Input Form -->
    <div class="surface-card p-4 rounded-2xl border space-y-3" style="border-color: var(--border-subtle);">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider flex items-center gap-1.5" style="color: var(--accent-cyan);">
          <span class="material-symbols-outlined text-16">post_add</span>
          <span>Prepare Result Entry</span>
        </h2>
        <span class="text-[10px] font-mono px-2 py-0.5 rounded font-bold" style="background-color: rgba(14,116,144,0.15); color: var(--accent-cyan);">QUEUED: <span id="queueCounterBadge">0</span></span>
      </div>

      <form id="bulkEntryForm" class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Result ID (Auto/Manual)</label>
            <input type="number" id="qResId" required min="1" placeholder="202" class="w-full px-3 py-2 rounded-xl text-xs font-mono outline-none surface-card border" style="border-color: var(--border-subtle);" />
          </div>
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Category</label>
            <select id="qCategory" required class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);">
              <option value="10th">10th</option>
              <option value="12th">12th</option>
              <option value="university">University</option>
              <option value="neet">NEET/JEE</option>
              <option value="govt">Govt Exam</option>
              <option value="other">Other</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Exam Title</label>
          <input type="text" id="qTitle" required placeholder="BSEB 12th Arts/Science Result 2026" class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);" />
        </div>

        <div>
          <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Card Subtitle / Label</label>
          <input type="text" id="qLabel" required placeholder="Bihar School Examination Board" class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Board / University</label>
            <input type="text" id="qBoard" required placeholder="BIHAR BOARD" class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);" />
          </div>
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Exam Year</label>
            <input type="text" id="qYear" required value="2026" class="w-full px-3 py-2 rounded-xl text-xs font-mono outline-none surface-card border" style="border-color: var(--border-subtle);" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Status</label>
            <select id="qStatus" required class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);">
              <option value="Result Available">Result Available (Live)</option>
              <option value="Coming Soon">Coming Soon</option>
              <option value="Date Announced">Date Announced</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Published Note</label>
            <input type="text" id="qPublished" required value="Declared Officially" class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);" />
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Official Marksheet Link</label>
          <input type="url" id="qUrl" required placeholder="http://results.biharboardonline.com" class="w-full px-3 py-2 rounded-xl text-xs outline-none surface-card border" style="border-color: var(--border-subtle);" />
        </div>

        <div>
          <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Short Description</label>
          <textarea id="qDescription" rows="2" required placeholder="Enter roll code & roll number to view marksheet." class="w-full px-3 py-2 rounded-xl text-xs resize-none outline-none surface-card border" style="border-color: var(--border-subtle);"></textarea>
        </div>

        <!-- Push Toggle for this item -->
        <div class="flex items-center justify-between p-2.5 rounded-xl surface-card border" style="border-color: var(--border-subtle);">
          <span class="text-xs font-bold" style="color: var(--text-primary);">Send Push Alert when Published</span>
          <label class="relative inline-flex items-center shrink-0">
            <input type="checkbox" id="qSendPush" checked class="sr-only">
            <div class="toggle-track"><div class="toggle-knob"></div></div>
          </label>
        </div>

        <!-- TWO ACTION BUTTONS -->
        <div class="grid grid-cols-2 gap-2 pt-1">
          <!-- 1. Save Directly to DB -->
          <button type="button" id="saveDirectBtn" class="py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 surface-card border" style="border-color: var(--border-subtle); color: var(--text-primary);">
            <span class="material-symbols-outlined text-16">save</span>
            <span>Save Directly</span>
          </button>

          <!-- 2. Save to Queue & Add More -->
          <button type="submit" id="saveQueueBtn" class="py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1 shadow-md" style="background-color: var(--accent-cyan); color: #FFFFFF;">
            <span class="material-symbols-outlined text-16">add_to_photos</span>
            <span>Queue (+ Add More)</span>
          </button>
        </div>
      </form>
    </div>

    <!-- PREVIEWS OF QUEUED RESULTS -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-xs font-bold uppercase tracking-wider" style="color: var(--text-muted);">
          Queued Results (<span id="queueCountText">0</span>)
        </h3>
        <button type="button" id="clearQueueBtn" class="text-[10px] font-bold text-rose-500 hover:underline hidden">
          Clear All Queue
        </button>
      </div>

      <div id="queuePreviewContainer" class="space-y-2.5">
        <div class="p-8 text-center rounded-2xl surface-card border space-y-1" style="border-color: var(--border-subtle);">
          <span class="material-symbols-outlined text-32" style="color: var(--text-subtle);">playlist_add</span>
          <p class="text-xs font-bold" style="color: var(--text-muted);">No Results in Queue Yet</p>
          <p class="text-[10px]" style="color: var(--text-subtle);">Fill the form above and click "Queue (+ Add More)"</p>
        </div>
      </div>

      <!-- PUBLISH ALL QUEUE TO APP BUTTON -->
      <div id="publishContainer" class="hidden pt-2">
        <button type="button" id="publishAllBtn" class="w-full py-3.5 rounded-2xl font-bold text-xs flex items-center justify-center gap-2 shadow-lg" style="background-color: var(--accent-mint); color: #FFFFFF;">
          <span class="material-symbols-outlined text-18">rocket_launch</span>
          <span>Publish All Queued Results to App Now</span>
        </button>
      </div>
    </div>
  </main>

  <div id="toastContainer" class="fixed top-4 inset-x-4 z-50 pointer-events-none space-y-2"></div>

  <script type="module" src="./js/bulk-results.js"></script>
</body>
</html>
