<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Resultify - Exam Results</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  <link rel="stylesheet" href="./css/custom.css">
  <script type="module" src="./js/auth-guard.js"></script>
  <script type="module" src="./js/results-pages.js"></script>
</head>
<body class="min-h-screen pb-14 select-none" style="background-color: var(--bg-void); color: var(--text-primary);">
  <header class="sticky top-0 z-30 border-b px-4 py-3 flex items-center justify-between backdrop-blur-xl" style="background-color: var(--bg-void); border-color: var(--border-subtle);">
    <div class="flex items-center gap-2.5">
      <a href="dashboard.html" class="w-8 h-8 rounded-xl flex items-center justify-center" style="background-color: var(--bg-surface); border: 1px solid var(--border-subtle); color: var(--text-muted);">
        <span class="material-symbols-outlined text-18">arrow_back</span>
      </a>
      <h1 class="text-sm font-bold" style="color: var(--text-primary);">Results Management</h1>
    </div>
    <button id="addResultBtn" class="px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 shadow-md" style="background-color: var(--accent-mint); color: var(--bg-void);">
      <span class="material-symbols-outlined text-16">add</span> Add Result
    </button>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-3.5">
    <div class="space-y-2">
      <input type="text" id="searchInput" placeholder="Search title, board, exam..." class="w-full px-3.5 py-2.5 rounded-xl text-xs" style="color: var(--text-primary);">
      <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-1">
        <button data-cat="all" class="cat-pill active px-3 py-1 rounded-lg text-[11px] font-bold" style="border: 1px solid var(--accent-mint); background-color: rgba(4, 120, 87, 0.15); color: var(--accent-mint);">All</button>
        <button data-cat="10th" class="cat-pill px-3 py-1 rounded-lg text-[11px] font-medium" style="border: 1px solid var(--border-subtle); background-color: var(--bg-surface); color: var(--text-muted);">10th</button>
        <button data-cat="12th" class="cat-pill px-3 py-1 rounded-lg text-[11px] font-medium" style="border: 1px solid var(--border-subtle); background-color: var(--bg-surface); color: var(--text-muted);">12th</button>
        <button data-cat="university" class="cat-pill px-3 py-1 rounded-lg text-[11px] font-medium" style="border: 1px solid var(--border-subtle); background-color: var(--bg-surface); color: var(--text-muted);">University</button>
        <button data-cat="neet" class="cat-pill px-3 py-1 rounded-lg text-[11px] font-medium" style="border: 1px solid var(--border-subtle); background-color: var(--bg-surface); color: var(--text-muted);">NEET/JEE</button>
        <button data-cat="govt" class="cat-pill px-3 py-1 rounded-lg text-[11px] font-medium" style="border: 1px solid var(--border-subtle); background-color: var(--bg-surface); color: var(--text-muted);">Govt Exams</button>
        <button data-cat="other" class="cat-pill px-3 py-1 rounded-lg text-[11px] font-medium" style="border: 1px solid var(--border-subtle); background-color: var(--bg-surface); color: var(--text-muted);">Other</button>
      </div>
    </div>

    <!-- Results Feed -->
    <div id="resultsFeed" class="space-y-2.5"></div>
  </main>

  <!-- Add/Edit Bottom Sheet Modal -->
  <div id="resultModalSheet" class="fixed inset-0 z-50 hidden backdrop-blur-sm flex flex-col justify-end" style="background-color: rgba(27, 40, 52, 0.65);">
    <div class="border-t rounded-t-3xl max-h-[92vh] flex flex-col shadow-2xl animate-sheet-up" style="background-color: var(--bg-surface); border-color: var(--border-subtle);">
      <div class="w-10 h-1 rounded-full mx-auto my-2.5 shrink-0" style="background-color: var(--border-subtle);"></div>
      <div class="px-4 py-2 border-b flex items-center justify-between shrink-0" style="border-color: var(--border-subtle);">
        <button id="resultSheetBackBtn" class="w-8 h-8 rounded-full flex items-center justify-center" style="background-color: var(--bg-elevated); color: var(--text-muted);">
          <span class="material-symbols-outlined text-16">arrow_back</span>
        </button>
        <h3 id="resultModalTitle" class="text-xs font-bold" style="color: var(--text-primary);">Add Exam Result</h3>
        <button id="resultSheetCloseBtn" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0" style="background-color: var(--bg-elevated); color: var(--text-muted);">
          <span class="material-symbols-outlined text-16">close</span>
        </button>
      </div>

      <div class="overflow-y-auto p-4 space-y-3.5 text-xs custom-scrollbar flex-1">
        <form id="resultForm" class="space-y-3">
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Result ID (Integer)</label>
              <input type="number" id="formResId" required min="1" placeholder="201" class="w-full px-3 py-2 rounded-xl text-xs font-mono">
            </div>
            <div>
              <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Category</label>
              <select id="formCategory" required class="w-full px-3 py-2 rounded-xl text-xs">
                <option value="10th">10th</option>
                <option value="12th">12th</option>
                <option value="university">University</option>
                <option value="neet">NEET/JEE</option>
                <option value="govt">Govt Exam</option>
                <option value="other">Other</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Title</label>
            <input type="text" id="formTitle" required placeholder="BSEB 10th Result 2026" class="w-full px-3 py-2 rounded-xl text-xs">
          </div>
          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Card Label / Subtitle</label>
            <input type="text" id="formLabel" required placeholder="Bihar School Examination Board" class="w-full px-3 py-2 rounded-xl text-xs">
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Board / University</label>
              <input type="text" id="formBoard" required placeholder="BIHAR BOARD" class="w-full px-3 py-2 rounded-xl text-xs">
            </div>
            <div>
              <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Year</label>
              <input type="text" id="formYear" required placeholder="2026" class="w-full px-3 py-2 rounded-xl text-xs font-mono">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Initial Status</label>
              <select id="formStatus" required class="w-full px-3 py-2 rounded-xl text-xs">
                <option value="Result Available">Result Available</option>
                <option value="Coming Soon">Coming Soon</option>
                <option value="Date Announced">Date Announced</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Published Info</label>
              <input type="text" id="formPublished" required placeholder="Declared Officially" class="w-full px-3 py-2 rounded-xl text-xs">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Official Marksheet Link</label>
            <input type="url" id="formUrl" required placeholder="https://results.biharboardonline.com" class="w-full px-3 py-2 rounded-xl text-xs">
          </div>

          <div>
            <label class="block text-[11px] font-bold mb-1" style="color: var(--text-muted);">Description</label>
            <textarea id="formDescription" required rows="2" placeholder="Instructions..." class="w-full px-3 py-2 rounded-xl text-xs resize-none"></textarea>
          </div>

          <div class="flex items-center gap-2 pt-1">
            <label class="relative inline-flex items-center shrink-0">
              <input type="checkbox" id="formSendPushToggle" class="sr-only">
              <div class="toggle-track"><div class="toggle-knob"></div></div>
            </label>
            <span class="text-xs font-bold" style="color: var(--text-primary);">Broadcast Push Alert Immediately</span>
          </div>
        </form>
      </div>

      <div class="p-3 border-t shrink-0" style="border-color: var(--border-subtle); background-color: var(--bg-void);">
        <button type="submit" form="resultForm" id="resultSubmitBtn" class="w-full py-2.5 rounded-xl font-bold text-xs shadow-md" style="background-color: var(--accent-mint); color: var(--bg-void);">
          Save Result
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="fixed top-4 inset-x-4 z-50 pointer-events-none space-y-2"></div>
</body>
</html>
